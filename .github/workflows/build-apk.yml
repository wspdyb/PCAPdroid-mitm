name: Build Hebrew APK

on:
  push:
    branches: [hebrew-apk]
  workflow_dispatch:

jobs:
  build:
    name: Build signed arm64 release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy requires a matching Python interpreter on the build host.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle signs the release only when ../keystore exists
      - name: Generate build keystore
        run: |
          keytool -genkey -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore keystore -storepass android -keypass android \
            -dname "CN=PCAPdroid mitm Hebrew, OU=Unknown, O=Unknown, C=Unknown"

      - name: Assemble release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Show APKs
        run: find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pcapdroid-mitm-hebrew-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
